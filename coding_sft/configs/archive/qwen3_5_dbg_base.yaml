# DEBUG alignment suite, arm base: 32 shortest trajectories (26K-60K tokens), 8 trajectories per
# optimizer step, 1 node x 8 GPU, 2 epochs = 8 steps. Schedule: th3k_align/group_schedule_dbg.json;
# caches built by build_arm_caches.py --world 8 (base ga=1, perdh ga=2 = 16 bins/step).
# Purpose: step-by-step loss alignment of base / perdh / tree, NOT a full run.
# Launch: ARM=base sbatch --reservation=rsi --job-name=chenth_dbg_base coding_sft/launch/slurm/run_align_dbg.slurm

### model
model_name_or_path: /storage/openpsi/users/chen/models/Qwen__Qwen3.5-4B-text
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: /storage/openpsi/users/chen/data/th3k_align
dataset: th3k_align
template: qwen3_5_text
enable_thinking: true
cutoff_len: 262144
train_on_prompt: false
mask_history: false
packing: false
overwrite_cache: false
tokenized_path: /storage/openpsi/users/chen/data/th3k_align/tokenized_qwen3_5_text_262144_dbg
preprocessing_num_workers: 32
dataloader_num_workers: 2

### output
output_dir: /storage/openpsi/users/chen/checkpoints/dbg_align_base
logging_steps: 1
save_strategy: "no"              # debug: no checkpoints, loss only
plot_loss: true
overwrite_output_dir: true
report_to: none
include_num_input_tokens_seen: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
disable_shuffling: true          # consume the pre-ordered (schedule-sorted) dataset sequentially
learning_rate: 1.0e-5
num_train_epochs: 1.0            # the schedule already contains 2 epochs of groups
max_steps: 8
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0
lr_scheduler_type: constant_with_warmup
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
