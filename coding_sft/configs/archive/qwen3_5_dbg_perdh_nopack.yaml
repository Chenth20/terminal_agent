# DEBUG alignment suite, arm A-UNPACKED ("perdh_nopack"): the SAME per-step rows as qwen3_5_dbg_perdh.yaml
# but ONE row per micro-batch (no neat packing). Rows of step s at [8*23*s, 8*23*(s+1)); steps with fewer
# rows are filled with 8-token dummy rows whose labels are all IGNORE (0 loss, 0 items). Same 8 trajectories,
# same supervised tokens and num_items_in_batch per step as arms base / perdh / tree -> isolates the effect
# of packing (block-diagonal FA2 + GDN cu_seqlens / seq_idx) on the loss.
# Launch: ARM=perdh_nopack sbatch --reservation=rsi --job-name=chenth_dbg_perdh_nopack coding_sft/launch/slurm/run_align_dbg.slurm

### model
model_name_or_path: /storage/openpsi/users/chen/models/Qwen__Qwen3.5-4B-text
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: /storage/openpsi/users/chen/data/th3k_align_perdh
dataset: th3k_perdh
template: qwen3_5_text
enable_thinking: true
cutoff_len: 262144
train_on_prompt: false
mask_history: true               # supervise the last turn only (history think is already stripped in the data)
packing: false                   # no packing: one perdh row per micro-batch
overwrite_cache: false
tokenized_path: /storage/openpsi/users/chen/data/th3k_align_perdh/tokenized_qwen3_5_text_262144_dbg_unpacked
preprocessing_num_workers: 32
dataloader_num_workers: 2

### output
output_dir: /storage/openpsi/users/chen/checkpoints/dbg_align_perdh_nopack
logging_steps: 1
save_strategy: "no"              # debug: no checkpoints, loss only
plot_loss: true
overwrite_output_dir: true
report_to: none
include_num_input_tokens_seen: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 23  # = G_u from build_arm_caches.py --perdh-unpacked-out: 8 x 23 rows per step
disable_shuffling: true          # consume the pre-ordered (schedule-sorted, rank-major) packed cache sequentially
learning_rate: 1.0e-5
num_train_epochs: 1.0            # the schedule already contains 2 epochs of groups
max_steps: 8
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0
lr_scheduler_type: constant_with_warmup
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
