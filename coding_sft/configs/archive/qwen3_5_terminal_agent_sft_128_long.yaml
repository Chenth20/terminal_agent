# Long-context stress test: whole trajectories, NO chunking, 1 epoch.
# Data: prepare_terminal_horizon.py --max-rows 128 --val-ratio 0.0625 --max-tokens 262144 --no-chunk
#   -> 120 train / 8 eval trajectories, one sample each, p50 117K tokens, p90 216K, max 262K
#      (10 of 128 trajectories truncated at the 262K budget at a pair boundary).
# Optimizer/schedule = TerminalHorizon paper (train.md) except num_train_epochs=1.
# Stress sweep (coding_sft/launch/slurm/bench_longctx.slurm, 8 longest samples, ZeRO-3 + liger + FA2 +
# grad-ckpt, 1 sample/GPU, 8 x L20X 143 GB):
#   cutoff 128K:  29 s/step  36.2K tok/s  peak  56 GB
#   cutoff 192K:  58 s/step  27.4K tok/s  peak  78 GB
#   cutoff 256K: 112 s/step  18.5K tok/s  peak 100 GB   <- fits, 40 GB headroom
#   256K + unsloth_gc: same speed, 64 GB (if ever needed for a bigger model)
#   256K + ZeRO-3 CPU offload / non-reentrant gc: no change
# Step time grows ~quadratically with length (FA2 attention on 8 full-attention layers), so the
# single biggest speed lever is NOT padding short samples up to the longest one in each step:
# train_sampling_strategy=group_by_length makes the 8 ranks see similar-length samples. With
# random sampling every step costs as much as its longest sample (~p90 = 216K).
#
#   WANDB_API_KEY=... CONFIG=coding_sft/configs/archive/qwen3_5_terminal_agent_sft_128_long.yaml \
#   SIF=.../llamafactory-agent-sft-tf5.12.1-latest.sif RUN_NAME=th128_long_256k \
#   sbatch coding_sft/launch/slurm/run_terminal_agent_sft.slurm

### model
model_name_or_path: /storage/openpsi/users/chen/models/Qwen__Qwen3.5-4B
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: /storage/openpsi/users/chen/data/terminal_horizon_128_long
dataset: th128_long
eval_dataset: th128_long_val
template: qwen3_5
enable_thinking: true
cutoff_len: 262144
train_on_prompt: false
mask_history: false
packing: false
overwrite_cache: false
preprocessing_num_workers: 16
dataloader_num_workers: 2

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 5

### output
output_dir: /storage/openpsi/users/chen/checkpoints/th128_long_qwen3.5_4b
logging_steps: 1
save_strategy: epoch
save_total_limit: 1
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: none
include_num_input_tokens_seen: true

### train (TerminalHorizon paper settings, 1 epoch)
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
train_sampling_strategy: group_by_length
learning_rate: 1.0e-5
num_train_epochs: 1.0
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
