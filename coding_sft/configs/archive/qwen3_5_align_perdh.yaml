# Alignment-suite arm A (per-decision-history, "perdh"): the same 306 trajectories as the baseline,
# expanded to 9235 per-step rows (th3k_perdh: history think stripped in the jsonl, mask_history: true
# -> only the last assistant turn is supervised). Each supervised token is therefore conditioned on
# exactly the context the model saw when it generated it (Terminus2, interleaved_thinking=false).
#
# tokenized_path is the GROUP-PACKED cache written by coding_sft/prep/build_arm_caches.py: for schedule
# step s, every per-step row of its 64 trajectories is packed (neat packing: sub-sequence ids in
# attention_mask, restarting position_ids, packing_params) into exactly 16 x 19 = 304 bins of
# <= 262144 tokens at rows [304 s, 304 (s+1)). With disable_shuffling + SequentialSampler rank r takes
# global micro-batch i with i % 16 == r, so ga = 19 makes one optimizer step consume exactly one group:
# the same 64 trajectories, the same 17.7M supervised tokens (asserted by the builder) as the baseline.
#
# Launch: ARM=perdh sbatch coding_sft/launch/slurm/run_align.slurm
# (Raw per-step tokenization, the builder's input, was produced from this file with
#  packing=false tokenized_path=.../th3k_align_perdh/tokenized_qwen3_5_text_262144 via build_tokenized_generic.slurm.)

### model
model_name_or_path: /storage/openpsi/users/chen/models/Qwen__Qwen3.5-4B-text
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: /storage/openpsi/users/chen/data/th3k_align_perdh
dataset: th3k_perdh
template: qwen3_5_text
enable_thinking: true
cutoff_len: 262144
train_on_prompt: false
mask_history: true               # supervise the last turn only (history think is already stripped in the data)
packing: true                    # cache rows are pre-packed bins; the collator needs neat_packing to emit
neat_packing: true               # cu_seq_lens / seq_idx so the FA2 + GatedDeltaNet layers isolate sub-sequences
overwrite_cache: false
tokenized_path: /storage/openpsi/users/chen/data/th3k_align_perdh/tokenized_qwen3_5_text_262144_sched_pack
preprocessing_num_workers: 32
dataloader_num_workers: 2

### output
output_dir: /storage/openpsi/users/chen/checkpoints/align_perdh
logging_steps: 1
save_strategy: steps
save_steps: 1
save_total_limit: 4
save_only_model: false
keep_optimizer_only_last: true
keep_weights_every: 5
plot_loss: true
overwrite_output_dir: true
report_to: none
include_num_input_tokens_seen: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 19  # = G from build_arm_caches.py (pack_manifest.json): 16 x 19 bins per step
disable_shuffling: true          # consume the pre-ordered (schedule-sorted, rank-major) packed cache sequentially
learning_rate: 1.0e-5
num_train_epochs: 1.0            # the schedule already contains 3 epochs of groups
max_steps: 15
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0
lr_scheduler_type: constant_with_warmup
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
