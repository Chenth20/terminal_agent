# Small TerminalHorizon test: 48 raw trajectories -> 234 train windows (40 trajs) + 43 eval
# windows (8 held-out trajs), produced by
#   python coding_sft/prep/prepare_terminal_horizon.py --max-rows 48 --val-ratio 0.17 \
#       --out-dir /storage/openpsi/users/chen/data/terminal_horizon_small --name th_small
# Same model / template / optimizer / ZeRO-3 / 32K windows as the full agent run; only the
# dataset, eval and run length differ. 234 / 16 = 15 steps per epoch; 2 epochs = 30 steps,
# ~40 min on 8xL20X (about 75 s/step at 16 x 32K tokens).
#
#   WANDB_API_KEY=... CONFIG=coding_sft/configs/archive/qwen3_5_terminal_agent_sft_small.yaml \
#   SIF=... RUN_NAME=th_small_tf5.12.1 sbatch coding_sft/launch/slurm/run_terminal_agent_sft.slurm

### model
model_name_or_path: /storage/openpsi/users/chen/models/Qwen__Qwen3.5-4B
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: /storage/openpsi/users/chen/data/terminal_horizon_small
dataset: th_small
eval_dataset: th_small_val
template: qwen3_5
enable_thinking: true
cutoff_len: 32768
train_on_prompt: false
mask_history: false
packing: false
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 5

### output
output_dir: /storage/openpsi/users/chen/checkpoints/th_small_qwen3.5_4b
logging_steps: 1
save_strategy: steps
save_steps: 30
save_total_limit: 1
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 2.0
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.98
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
