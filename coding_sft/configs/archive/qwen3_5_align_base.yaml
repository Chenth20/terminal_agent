# Alignment-suite baseline: 306 aligned trajectories (th3k_align), whole-trajectory SFT (history think
# visible = current practice), 2 nodes x 8 GPU, ga=4 -> 64 trajectories per optimizer step. Same recipe
# as abl_mask_const_slurm2n.
#
# tokenized_path is the SCHEDULE-ORDERED cache written by coding_sft/prep/build_arm_caches.py
# (rows [64s, 64s+64) = group s of group_schedule.json, 3 epochs x 5 groups = 15 steps); with
# disable_shuffling + SequentialSampler every rank r takes global micro-batch i with i % 16 == r, so one
# optimizer step consumes exactly one group. Launch: ARM=base sbatch coding_sft/launch/slurm/run_align.slurm

### model
model_name_or_path: /storage/openpsi/users/chen/models/Qwen__Qwen3.5-4B-text
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: /storage/openpsi/users/chen/data/th3k_align
dataset: th3k_align
template: qwen3_5_text
enable_thinking: true
cutoff_len: 262144
train_on_prompt: false
mask_history: false
packing: false
overwrite_cache: false
tokenized_path: /storage/openpsi/users/chen/data/th3k_align/tokenized_qwen3_5_text_262144_sched
preprocessing_num_workers: 32
dataloader_num_workers: 2

### output
output_dir: /storage/openpsi/users/chen/checkpoints/align_base
logging_steps: 1
save_strategy: steps
save_steps: 1
save_total_limit: 4
save_only_model: false
keep_optimizer_only_last: true
keep_weights_every: 5
plot_loss: true
overwrite_output_dir: true
report_to: none
include_num_input_tokens_seen: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4   # 16 GPUs x 4 = 64 trajectories/step
disable_shuffling: true          # consume the pre-ordered (schedule-sorted) dataset sequentially
learning_rate: 1.0e-5
num_train_epochs: 1.0            # the schedule already contains 3 epochs of groups
max_steps: 15
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0
lr_scheduler_type: constant_with_warmup
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
