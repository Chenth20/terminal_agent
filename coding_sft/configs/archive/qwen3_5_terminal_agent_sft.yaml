# Full SFT of Qwen3.5-4B on TerminalHorizon-3K (Terminus-2 terminal-agent trajectories).
#
# Recipe adapted from OpenThoughts-Agent sft/lf_configs/qwen3_5/32k_9b.yaml
# (full SFT, ZeRO-3, 32K window, cosine, warmup 0.1, adam_beta2 0.98, liger on),
# with these deliberate deviations:
#   * learning_rate 1e-5 instead of 4e-5 and 1 epoch instead of 7 -> conservative
#     baseline for a 4B model on 3K trajectories (~17K windows); raise once stable.
#   * max_grad_norm 1.0 instead of 1e-4 (their value is an experiment artefact).
#   * per_device_train_batch_size 1 x grad_accum 2 x 8 GPUs = global batch 16.
#   * template qwen3_5 (thinking) because 100% of assistant turns carry <think>;
#     the prep script rewrites them to the template's exact thought layout.
#   * mask_history=false / train_on_prompt=false (LF defaults, stated explicitly):
#     every assistant action in a window is supervised, no terminal output is.
#   * packing off: windows are already ~cutoff_len; packing would only pad-merge.
#   * data pre-chunked to <= cutoff_len by coding_sft/prep/prepare_terminal_horizon.py,
#     so LF's truncation never cuts an assistant turn mid-JSON. Output lives OUTSIDE the
#     repo tree: the /home/admin -> /storage afsync mirror deletes files that only exist
#     on the /storage side.
#
# Required env (set by coding_sft/launch/slurm/run_terminal_agent_sft.slurm): IMAGE_PLACEHOLDER /
# VIDEO_PLACEHOLDER / AUDIO_PLACEHOLDER overridden, because terminal output contains the literal
# strings <image>/<video>/<audio> and the qwen3_5 template's multimodal plugin would otherwise
# reject those rows ("number of images does not match").
#
# Usage: see coding_sft/launch/slurm/run_terminal_agent_sft.slurm

### model
model_name_or_path: /storage/openpsi/users/chen/models/Qwen__Qwen3.5-4B
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: /storage/openpsi/users/chen/data/terminal_horizon
dataset: terminal_horizon_3k
template: qwen3_5
enable_thinking: true
cutoff_len: 32768
train_on_prompt: false
mask_history: false
packing: false
overwrite_cache: false
preprocessing_num_workers: 32
dataloader_num_workers: 4

### output
output_dir: /storage/openpsi/users/chen/checkpoints/sft_terminal_horizon_3k_qwen3.5_4b
logging_steps: 5
save_strategy: steps
save_steps: 200
save_total_limit: 2
save_only_model: false
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 1.0
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.98
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
